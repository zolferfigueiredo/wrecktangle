name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # Slint makes an uncached build slow; tighten once a cached run is measured.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
      - run: rustup toolchain install && rustup target add x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo fmt --check
      - run: cargo test
      - run: cargo clippy --target x86_64-pc-windows-gnu --all-targets -- -D warnings
      - run: cargo build --release --target x86_64-pc-windows-gnu
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: wectangle
          path: target/x86_64-pc-windows-gnu/release/wectangle.exe
