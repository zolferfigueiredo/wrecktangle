name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    # Local cold run (cargo clean, then clippy + test + release) measured
    # ~35s on this machine; see the commit that added this comment.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: wectangle
          path: target/release/wectangle.exe
