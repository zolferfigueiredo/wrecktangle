name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - installer/**

permissions:
  contents: write

jobs:
  release:
    # The same MSVC build as run.bat, so the tests run natively and Inno
    # Setup runs on Windows instead of under Wine.
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Determine the version to build
        run: |
          # The checkout has CRLF line endings on Windows.
          version=$(tr -d '\r' < Cargo.toml | sed -n 's/^version = "\(.*\)"$/\1/p' | head -n 1)
          # Only a tag push publishes. A manual run or a pull request that
          # touches the release is build-only, so there is no tag to check.
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo version v$version" >&2
            exit 1
          fi
          echo "V=$version" >> "$GITHUB_ENV"
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo test
      - run: cargo build --release

      - name: Zip
        run: |
          mkdir -p dist
          cp target/release/wrecktangle.exe dist/wrecktangle.exe
          (cd dist && 7z a -tzip "Wrecktangle-$V-x64.zip" wrecktangle.exe)

      - name: Build the installer
        # PowerShell, because Git Bash would rewrite the /D arguments as paths.
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc "/DAppVersion=$env:V" "/DSourceExe=..\dist\wrecktangle.exe" installer\wrecktangle.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Checksums and latest.json
        run: |
          sha256=$(sha256sum "dist/Wrecktangle-$V-x64.zip" | cut -d ' ' -f1)
          printf '{"version":"%s","sha256":{"x64":"%s"}}\n' "$V" "$sha256" > dist/latest.json
          (cd dist && sha256sum "Wrecktangle-$V-x64.zip" "Wrecktangle-$V-x64-setup.exe" > SHA256SUMS)

      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$V" \
            "dist/Wrecktangle-$V-x64-setup.exe" \
            "dist/Wrecktangle-$V-x64.zip" \
            "dist/latest.json" \
            "dist/SHA256SUMS" \
            --title "Wrecktangle $V" --generate-notes

      - name: Upload the build
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Wrecktangle-${{ env.V }}-build
          retention-days: 14
          path: |
            dist/wrecktangle.exe
            dist/Wrecktangle-${{ env.V }}-x64-setup.exe
            dist/Wrecktangle-${{ env.V }}-x64.zip
