name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check the tag matches the Cargo version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo version v$version" >&2
            exit 1
          fi
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
      - run: rustup toolchain install && rustup target add x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo build --release --target x86_64-pc-windows-gnu
      - run: cp target/x86_64-pc-windows-gnu/release/wrecktangle.exe wrecktangle.exe
      - run: gh release create "$GITHUB_REF_NAME" wrecktangle.exe --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
