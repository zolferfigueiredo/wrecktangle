name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - installer/**

permissions:
  contents: write

jobs:
  release:
    # The same MSVC build as run.bat, so the tests run natively and Inno
    # Setup runs on Windows instead of under Wine.
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Full history, so a tag can be checked against main.
          fetch-depth: 0
      - name: Determine the version to build
        run: |
          # The checkout has CRLF line endings on Windows.
          version=$(tr -d '\r' < Cargo.toml | sed -n 's/^version = "\(.*\)"$/\1/p' | head -n 1)
          # Only a tag push publishes. A manual run or a pull request that
          # touches the release is build-only, so there is no tag to check.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "Tag $GITHUB_REF_NAME does not match Cargo version v$version" >&2
              exit 1
            fi
            # Releases come from main only: a tag on any other branch fails
            # here, before anything is built or published.
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "Tag $GITHUB_REF_NAME is not on main; merge first, then tag main" >&2
              exit 1
            fi
          fi
          echo "V=$version" >> "$GITHUB_ENV"
      - run: rustup toolchain install && rustup target add i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo test
      - run: cargo test --target i686-pc-windows-msvc
      - run: cargo build --release
      - run: cargo build --release --target i686-pc-windows-msvc

      - name: Zip
        # x64 is the 64-bit build, x86 the 32-bit one; each zip holds a plain
        # wrecktangle.exe.
        run: |
          mkdir -p dist/x64 dist/x86
          cp target/release/wrecktangle.exe dist/x64/wrecktangle.exe
          cp target/i686-pc-windows-msvc/release/wrecktangle.exe dist/x86/wrecktangle.exe
          for arch in x64 x86; do
            (cd "dist/$arch" && 7z a -tzip "../Wrecktangle-$V-$arch.zip" wrecktangle.exe)
          done

      - name: Build the installers
        # PowerShell, because Git Bash would rewrite the /D arguments as paths.
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          foreach ($arch in "x64", "x86") {
            & $iscc "/DAppVersion=$env:V" "/DArch=$arch" "/DSourceExe=..\dist\$arch\wrecktangle.exe" installer\wrecktangle.iss
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Checksums and latest.json
        run: |
          x64=$(sha256sum "dist/Wrecktangle-$V-x64.zip" | cut -d ' ' -f1)
          x86=$(sha256sum "dist/Wrecktangle-$V-x86.zip" | cut -d ' ' -f1)
          printf '{"version":"%s","sha256":{"x64":"%s","x86":"%s"}}\n' "$V" "$x64" "$x86" > dist/latest.json
          (cd dist && sha256sum Wrecktangle-$V-x64.zip Wrecktangle-$V-x64-setup.exe \
            Wrecktangle-$V-x86.zip Wrecktangle-$V-x86-setup.exe > SHA256SUMS)

      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$V" \
            "dist/Wrecktangle-$V-x64-setup.exe" \
            "dist/Wrecktangle-$V-x64.zip" \
            "dist/Wrecktangle-$V-x86-setup.exe" \
            "dist/Wrecktangle-$V-x86.zip" \
            "dist/latest.json" \
            "dist/SHA256SUMS" \
            --title "Wrecktangle $V" --generate-notes

      - name: Upload the build
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Wrecktangle-${{ env.V }}-build
          retention-days: 14
          path: |
            dist/Wrecktangle-${{ env.V }}-x64-setup.exe
            dist/Wrecktangle-${{ env.V }}-x64.zip
            dist/Wrecktangle-${{ env.V }}-x86-setup.exe
            dist/Wrecktangle-${{ env.V }}-x86.zip
