name: Bug report
description: Something in Wrecktangle doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Security problems go to contact@zolfer.com instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: I pressed Ctrl+Alt+Left on a Chrome window and it moved to the right half instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Press ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Wrecktangle version
      description: Shown on the About tab in Settings.
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: "Run winver to see it."
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: Anything that might matter, such as the number of monitors and their scaling, the app whose window you moved, other shortcut tools (PowerToys, AutoHotkey) or your keyboard layout.
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Drag images here. Settings shows a note next to shortcuts that another app owns; a screenshot of it helps.
