name: Feature request
description: Suggest a new action, setting or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you're trying to do and what gets in the way today.
      placeholder: I'd like to move a window to the left third of the screen with one shortcut.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Wrecktangle help?
      description: The shortcut, setting or behavior you have in mind. If Rectangle or another tool does it, say how.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do now?
      description: Workarounds or other tools you use for this today, if any.
