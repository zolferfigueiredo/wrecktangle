  </defs>
  <rect width="20" height="20" rx="4.5" fill="url(#tile)"/>
  <g mask="url(#bite)">
    <rect x="7" y="9" width="10" height="8" rx="2" fill="#121212"/>
    <rect x="8" y="11" width="8" height="5" rx="0.5" fill="#FFFFFF"/>
    <circle cx="6.75" cy="8.25" r="4.5" fill="none" stroke="#121212" stroke-width="1" clip-path="url(#window-clip)"/>
  </g>
  <line x1="6.75" y1="8.25" x2="3.58" y2="0" stroke="#121212" stroke-width="1" clip-path="url(#tile-clip)"/>
  <circle cx="6.75" cy="8.25" r="2.5" fill="url(#ball)"/>
