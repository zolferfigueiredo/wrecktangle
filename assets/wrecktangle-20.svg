<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD84A"/>
      <stop offset="1" stop-color="#EEAD00"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#7A818B"/>
      <stop offset="0.6" stop-color="#1B1D21"/>
      <stop offset="1" stop-color="#0B0C0E"/>
    </radialGradient>
    <clipPath id="tile-clip"><rect width="20" height="20" rx="4.5"/></clipPath>
    <clipPath id="window-clip"><rect x="7" y="9" width="10" height="8" rx="2"/></clipPath>
    <mask id="bite" maskUnits="userSpaceOnUse" x="0" y="0" width="20" height="20">
      <rect width="20" height="20" fill="#FFFFFF"/>
      <circle cx="6.75" cy="8.25" r="4" fill="#000000"/>
