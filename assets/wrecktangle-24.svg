  <rect width="24" height="24" rx="5.25" fill="url(#tile)"/>
  <g mask="url(#bite)">
    <rect x="9" y="11" width="12" height="10" rx="2.25" fill="#121212"/>
    <rect x="10" y="14" width="10" height="6" rx="0.75" fill="url(#window)"/>
    <circle cx="8.25" cy="10.25" r="5.25" fill="none" stroke="#121212" stroke-width="1" clip-path="url(#window-clip)"/>
  </g>
  <line x1="8.25" y1="10.25" x2="4.31" y2="0" stroke="#121212" stroke-width="1" clip-path="url(#tile-clip)"/>
  <circle cx="8.25" cy="10.25" r="3.25" fill="url(#ball)"/>
