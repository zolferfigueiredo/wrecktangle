<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD84A"/>
      <stop offset="1" stop-color="#EEAD00"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4E8EE"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#858C96"/>
      <stop offset="0.6" stop-color="#1B1D21"/>
      <stop offset="1" stop-color="#0B0C0E"/>
    </radialGradient>
    <clipPath id="tile-clip"><rect width="24" height="24" rx="5.25"/></clipPath>
    <clipPath id="window-clip"><rect x="9" y="11" width="12" height="10" rx="2.25"/></clipPath>
    <mask id="bite" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <rect width="24" height="24" fill="#FFFFFF"/>
      <circle cx="8.25" cy="10.25" r="4.75" fill="#000000"/>
