<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD84A"/>
      <stop offset="1" stop-color="#EEAD00"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#9C6400" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4E8EE"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#8E959F"/>
      <stop offset="0.3" stop-color="#4A5058"/>
      <stop offset="0.7" stop-color="#1B1D21"/>
      <stop offset="1" stop-color="#0B0C0E"/>
    </radialGradient>
    <clipPath id="tile-clip"><rect x="1" y="1" width="30" height="30" rx="7"/></clipPath>
    <clipPath id="window-clip"><rect x="11" y="13" width="18" height="16" rx="2.5"/></clipPath>
    <mask id="bite" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect width="32" height="32" fill="#FFFFFF"/>
      <circle cx="9.5" cy="11.75" r="6.5" fill="#000000"/>
    </mask>
  </defs>
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#tile)"/>
  <rect x="1.5" y="1.5" width="29" height="29" rx="6.5" fill="none" stroke="url(#rim)" stroke-width="1"/>
  <g mask="url(#bite)">
    <rect x="11" y="13" width="18" height="16" rx="2.5" fill="#121212"/>
    <rect x="12" y="16" width="16" height="12" rx="1" fill="url(#window)"/>
    <circle cx="9.5" cy="11.75" r="7" fill="none" stroke="#121212" stroke-width="1" clip-path="url(#window-clip)"/>
  </g>
  <line x1="9.5" y1="11.75" x2="5" y2="0" stroke="#121212" stroke-width="1.5" clip-path="url(#tile-clip)"/>
  <circle cx="9.5" cy="11.75" r="4.75" fill="url(#ball)"/>
</svg>
