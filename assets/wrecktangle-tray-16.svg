<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <defs>
    <clipPath id="window-clip"><rect x="4" y="6" width="11" height="9" rx="2"/></clipPath>
    <mask id="window-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="16" height="16">
      <rect width="16" height="16" fill="#FFFFFF"/>
      <rect x="5" y="8" width="9" height="6" rx="1" fill="#000000"/>
    </mask>
    <mask id="bite" maskUnits="userSpaceOnUse" x="0" y="0" width="16" height="16">
      <rect width="16" height="16" fill="#FFFFFF"/>
      <circle cx="3.5" cy="5.5" r="4" fill="#000000"/>
    </mask>
  </defs>
  <g mask="url(#bite)">
    <rect x="4" y="6" width="11" height="9" rx="2" fill="#000000" mask="url(#window-cut)"/>
    <circle cx="3.5" cy="5.5" r="4.5" fill="none" stroke="#000000" stroke-width="1" clip-path="url(#window-clip)"/>
  </g>
  <line x1="3.5" y1="5.5" x2="1.4" y2="0" stroke="#000000" stroke-width="1"/>
  <circle cx="3.5" cy="5.5" r="2.5" fill="#000000"/>
</svg>
