<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20">
  <defs>
    <clipPath id="window-clip"><rect x="5" y="7" width="14" height="12" rx="2.5"/></clipPath>
    <mask id="window-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="20" height="20">
      <rect width="20" height="20" fill="#FFFFFF"/>
      <rect x="6" y="10" width="12" height="8" rx="1.5" fill="#000000"/>
    </mask>
    <mask id="bite" maskUnits="userSpaceOnUse" x="0" y="0" width="20" height="20">
      <rect width="20" height="20" fill="#FFFFFF"/>
      <circle cx="4.5" cy="6.5" r="5" fill="#000000"/>
    </mask>
  </defs>
  <g mask="url(#bite)">
    <rect x="5" y="7" width="14" height="12" rx="2.5" fill="#000000" mask="url(#window-cut)"/>
    <circle cx="4.5" cy="6.5" r="5.5" fill="none" stroke="#000000" stroke-width="1" clip-path="url(#window-clip)"/>
  </g>
  <line x1="4.5" y1="6.5" x2="2" y2="0" stroke="#000000" stroke-width="1"/>
  <circle cx="4.5" cy="6.5" r="3.5" fill="#000000"/>
</svg>
