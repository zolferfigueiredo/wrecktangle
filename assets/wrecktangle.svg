<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD84A"/>
      <stop offset="1" stop-color="#EEAD00"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#9C6400" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4E8EE"/>
    </linearGradient>
    <linearGradient id="titlebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3F47"/>
      <stop offset="1" stop-color="#1A1D21"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#959CA6"/>
      <stop offset="0.3" stop-color="#4A5058"/>
      <stop offset="0.7" stop-color="#1B1D21"/>
      <stop offset="1" stop-color="#0B0C0E"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4C525A"/>
      <stop offset="1" stop-color="#16181B"/>
    </linearGradient>
    <filter id="window-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#6B4200" flood-opacity="0.42"/>
    </filter>
    <filter id="ball-shadow" x="-40%" y="-40%" width="190%" height="200%">
      <feDropShadow dx="8" dy="16" stdDeviation="14" flood-color="#5A3700" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="tile-clip">
      <rect x="16" y="16" width="480" height="480" rx="112"/>
    </clipPath>
    <clipPath id="window-clip">
      <rect x="168" y="204" width="292" height="256" rx="40"/>
    </clipPath>
    <mask id="bite" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#FFFFFF"/>
      <circle cx="152" cy="188" r="104" fill="#000000"/>
    </mask>
    <mask id="crescent" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#FFFFFF"/>
      <circle cx="140" cy="176" r="80" fill="#000000"/>
    </mask>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)"/>
  <rect x="18" y="18" width="476" height="476" rx="110" fill="none" stroke="url(#rim)" stroke-width="4"/>

  <g filter="url(#window-shadow)">
    <g mask="url(#bite)">
      <g clip-path="url(#window-clip)">
        <rect x="168" y="204" width="292" height="256" fill="url(#window)"/>
        <rect x="168" y="204" width="292" height="56" fill="url(#titlebar)"/>
      </g>
      <rect x="169.5" y="205.5" width="289" height="253" rx="38.5" fill="none" stroke="#121212" stroke-opacity="0.28" stroke-width="3"/>
    </g>
  </g>
  <g fill="none" stroke="#C9CED6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="338" y1="233" x2="356" y2="233"/>
    <rect x="373" y="223" width="18" height="18" rx="3"/>
    <path d="M409 223L427 241M427 223L409 241"/>
  </g>

  <g clip-path="url(#tile-clip)">
    <line x1="152" y1="188" x2="80" y2="0" stroke="#1C1E22" stroke-width="14"/>
    <line x1="149.2" y1="189.1" x2="77.2" y2="1.1" stroke="#6A707A" stroke-width="3" stroke-opacity="0.7"/>
  </g>
  <rect x="104.2" y="95.7" width="34" height="24" rx="6" transform="rotate(-21 121.2 107.7)" fill="url(#steel)"/>

  <circle cx="152" cy="188" r="78" fill="url(#ball)" filter="url(#ball-shadow)"/>
  <circle cx="152" cy="188" r="78" fill="#F5C400" fill-opacity="0.3" mask="url(#crescent)"/>
  <ellipse cx="126" cy="158" rx="22" ry="14" transform="rotate(-35 126 158)" fill="#FFFFFF" fill-opacity="0.5" filter="url(#soft)"/>
</svg>
