[package]
name = "wrecktangle"
version = "0.9.0-beta.3"
edition = "2024"
license = "MIT"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Devices_Display", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Globalization", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Security", "Win32_Security_Authentication_Identity", "Win32_Security_Cryptography", "Win32_System_Registry", "Win32_System_TaskScheduler", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Diagnostics_ToolHelp", "Win32_Networking_WinHttp", "UI", "UI_ViewManagement"] }
# Direct2D takes its points and transforms from here; `windows` does not
# re-export them.
windows-numerics = "0.3.1"

# Only for `cargo run --example make_icon`.
[dev-dependencies]
resvg = { version = "0.48.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
cosmic-text = "0.19.0"
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
png = "0.18.1"
signal-hook = "0.4.6"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd", "png-format"] }
x11rb = { version = "0.14.0", features = ["cursor", "randr", "resource_manager", "xkb"] }
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "async-io"] }

[build-dependencies]
embed-resource = "3.0.11"

# Font shaping and drawing (cosmic-text, tiny-skia) are slow unoptimized,
# which made a debug build's Settings window take seconds to open.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
